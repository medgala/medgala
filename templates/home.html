<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MED GALA Milano</title>
  <meta name="description" content="The first inter-university gala for medical students in Milan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="home">

<header class="site-header">
  <div class="nav-shell">
    <a href="/" class="brand">MED GALA</a>

    <nav class="nav-desktop">
      <a href="/" class="nav-link active-link" data-i18n="nav.home">Home</a>
      <a href="/contact" class="nav-link" data-i18n="nav.contact">Contact</a>
      <div class="lang-switch desktop-lang">
        <button type="button" class="lang-btn" data-lang="it">IT</button>
        <span>|</span>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </nav>

    <div class="mobile-actions">
      <div class="lang-switch mobile-lang">
        <button type="button" class="lang-btn" data-lang="it">IT</button>
        <span>|</span>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
      <button type="button" class="menu-toggle" id="menuToggle">☰</button>
    </div>
  </div>

  <div class="mobile-menu" id="mobileMenu">
    <a href="/" data-i18n="nav.home">Home</a>
    <a href="/contact" data-i18n="nav.contact">Contact</a>
  </div>
</header>

<section class="hero-section">
  <div class="hero-bg">
    <img src="https://media.base44.com/images/public/69d8d00039b0e87f8dc895f4/09f33fd90_generated_2b682279.png" alt="Gala atmosphere">
    <div class="hero-overlay"></div>
  </div>

  <div class="hero-content">
    <h1>MED GALA</h1>

    <div class="hero-copy">
      <p class="hero-subtitle" id="heroSubtitle"></p>
      <p class="hero-tagline" id="heroTagline"></p>
    </div>

    <div class="hero-actions">
      <a href="/aggiornamenti" class="hero-button" id="heroCta"></a>
    </div>
  </div>

  <div class="scroll-indicator">
    <div class="scroll-line"></div>
  </div>
</section>

<section class="about-section">
  <div class="section-shell two-col">
    <div class="about-text">
      <p class="section-label" id="aboutLabel"></p>
      <h2>
        <span id="aboutHeading1"></span><br>
        <span class="accent">MED GALA</span><br>
        <span id="aboutHeading3"></span>
      </h2>
      <div class="section-line"></div>
      <p class="section-text" id="aboutText"></p>
    </div>

    <div class="about-image-wrap">
      <img src="https://media.base44.com/images/public/69d8d00039b0e87f8dc895f4/b43f383c8_generated_1fe3020b.png" alt="Elegant gala atmosphere" class="about-image">
      <div class="about-frame"></div>
    </div>
  </div>
</section>

<section class="universities-section dark-section">
  <div class="section-shell narrow-center">
    <p class="section-label light-label" id="uniLabel"></p>
    <h2 class="center-title" id="uniHeading"></h2>

    <div class="uni-list">
      <div class="uni-row">Humanitas University</div>
      <div class="uni-row">Università degli Studi di Milano</div>
      <div class="uni-row">Università Vita-Salute San Raffaele</div>
      <div class="uni-row">Università degli Studi di Milano-Bicocca</div>
    </div>
  </div>
</section>

<section class="highlights-section">
  <div class="section-shell">
    <div class="center-block">
      <p class="section-label" id="highlightsLabel"></p>
      <h2 class="center-title" id="highlightsHeading"></h2>
    </div>

    <div class="highlights-grid">
      <div class="highlights-image-wrap">
        <img src="https://media.base44.com/images/public/69d8d00039b0e87f8dc895f4/38a9dd8f5_generated_46126f6d.png" alt="Elegant dinner setup" class="highlights-image">
      </div>

      <div class="highlights-list">
        <div class="highlight-item">
          <div class="highlight-icon">✦</div>
          <p id="highlight0"></p>
        </div>
        <div class="highlight-item">
          <div class="highlight-icon">✦</div>
          <p id="highlight1"></p>
        </div>
        <div class="highlight-item">
          <div class="highlight-icon">✦</div>
          <p id="highlight2"></p>
        </div>
        <div class="highlight-item">
          <div class="highlight-icon">✦</div>
          <p id="highlight3"></p>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="event-section light-grey-section">
  <div class="section-shell narrow-center">
    <div class="center-block">
      <p class="section-label" id="eventLabel"></p>
      <h2 class="center-title" id="eventHeading"></h2>
    </div>

    <div class="event-grid">
      <div class="event-card">
        <div class="event-icon">⌖</div>
        <p class="event-card-label" id="eventDetailLabel0"></p>
        <p class="event-card-value" id="eventDetailValue0"></p>
      </div>

      <div class="event-card">
        <div class="event-icon">◌</div>
        <p class="event-card-label" id="eventDetailLabel1"></p>
        <p class="event-card-value" id="eventDetailValue1"></p>
      </div>

      <div class="event-card">
        <div class="event-icon">✦</div>
        <p class="event-card-label" id="eventDetailLabel2"></p>
        <p class="event-card-value" id="eventDetailValue2"></p>
      </div>
    </div>
  </div>
</section>

<section class="cta-section">
  <div class="section-shell narrow-center">
    <div class="cta-line"></div>
    <h2 class="center-title">
      <span id="ctaJoin"></span><br>
      <span class="accent" id="ctaHeading2"></span>
    </h2>
    <p class="section-text cta-text" id="ctaSubtext"></p>
    <a href="/aggiornamenti" class="premium-button" id="ctaButtonText"></a>
  </div>
</section>

<footer class="site-footer">
  <div class="section-shell footer-shell">
    <p class="footer-brand">MED GALA Milano</p>
    <div class="footer-line"></div>

    <div class="footer-links">
      <a href="https://instagram.com/medgalaofficial" target="_blank" rel="noopener noreferrer">@medgalaofficial</a>
      <a href="mailto:info@medgala.events">info@medgala.events</a>
    </div>

    <p class="footer-copy">© 2026 MED GALA Milano. <span id="footerRights"></span></p>
  </div>
</footer>

<script src="/static/js/lang.js"></script>
</body>
</html>
